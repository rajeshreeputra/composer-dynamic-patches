name: CI Tests

on:
  push:
    branches: [ main, develop, 2.x ]
  pull_request:
    branches: [ main, develop, 2.x ]
  workflow_dispatch:

jobs:
  # Job 1: Validate composer.json and run static analysis
  static-analysis:
    name: Static Analysis (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Check PHP syntax
        run: find src -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Display PHP version
        run: php -v

  # Job 2: Code Quality Checks
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: json
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Check file structure
        run: |
          test -f composer.json || exit 1
          test -f README.md || exit 1
          test -f CHANGELOG.md || exit 1
          test -f src/Plugin/Plugin.php || exit 1
          test -f src/Resolver/DynamicPatchesFile.php || exit 1
          test -f src/Resolver/DynamicPatchesResolverBase.php || exit 1
          echo "✅ All required files exist"

      - name: Verify bug fixes
        run: |
          # Check that InstalledVersions bug is fixed
          if grep -q "InstalledVersions::getPrettyVersion" src/Resolver/DynamicPatchesFile.php; then
            echo "❌ BUG: Still using broken InstalledVersions::getPrettyVersion()"
            exit 1
          fi
          echo "✅ InstalledVersions bug is fixed"
          
          # Check that Semver is used
          if ! grep -q "Semver::satisfies" src/Resolver/DynamicPatchesFile.php; then
            echo "❌ Missing: Semver::satisfies() not found"
            exit 1
          fi
          echo "✅ Using Semver::satisfies() for version matching"
          
          # Check provenance tracking
          if ! grep -q "provenance" src/Resolver/DynamicPatchesFile.php; then
            echo "❌ Missing: Provenance tracking"
            exit 1
          fi
          echo "✅ Provenance tracking implemented"

  # Job 3: Composer compatibility test
  composer-compatibility:
    name: Composer Compatibility (Composer ${{ matrix.composer }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        composer: ['2.2', '2.3', '2.4', '2.5', '2.6', '2.7']
        php: ['8.1']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: none
          tools: composer:v2

      - name: Install specific Composer version
        run: composer self-update ${{ matrix.composer }}

      - name: Display Composer version
        run: composer --version

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

  # Job 4: Integration test with real project
  integration-test:
    name: Integration Test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: composer-dynamic-patches

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: none
          tools: composer:v2

      - name: Create test project
        run: |
          composer create-project drupal/recommended-project:^10 test-project --no-install
          cd test-project
          
          # Add the plugin as a path repository
          composer config repositories.composer-dynamic-patches path ../composer-dynamic-patches
          
          # Allow plugins
          composer config allow-plugins.cweagans/composer-patches true
          composer config allow-plugins.rajeshreeputra/composer-dynamic-patches true
          
          # Install the plugin
          composer require rajeshreeputra/composer-dynamic-patches:@dev --no-update
          
          # Add some test packages with patches
          composer require symfony/console:^6.0 monolog/monolog:^3.0 --no-update
          
          # Install all dependencies
          composer install --prefer-dist --no-progress -vv

      - name: Verify plugin loaded
        run: |
          cd test-project
          if composer show rajeshreeputra/composer-dynamic-patches > /dev/null 2>&1; then
            echo "✅ Plugin installed successfully"
          else
            echo "❌ Plugin installation failed"
            exit 1
          fi

      - name: Check vendor directory
        run: |
          cd test-project
          if [ -d "vendor" ]; then
            echo "✅ Vendor directory created"
          else
            echo "❌ Vendor directory not found"
            exit 1
          fi

  # Job 5: Documentation check
  documentation:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check README
        run: |
          if [ ! -f README.md ]; then
            echo "❌ README.md not found"
            exit 1
          fi
          
          # Check for required sections
          grep -q "Installation" README.md || { echo "❌ Missing Installation section"; exit 1; }
          grep -q "Usage" README.md || { echo "❌ Missing Usage section"; exit 1; }
          grep -q "Requirements" README.md || { echo "❌ Missing Requirements section"; exit 1; }
          
          echo "✅ README.md is complete"

      - name: Check CHANGELOG
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "❌ CHANGELOG.md not found"
            exit 1
          fi
          
          grep -q "2.0.0" CHANGELOG.md || { echo "❌ Version 2.0.0 not documented"; exit 1; }
          
          echo "✅ CHANGELOG.md is complete"

      - name: Check composer.json requirements
        run: |
          # Check PHP requirement
          grep -q '"php": ">=8.0.0"' composer.json || { echo "❌ PHP 8.0+ requirement missing"; exit 1; }
          
          # Check Plugin API requirement
          grep -q '"composer-plugin-api": "\^2.0"' composer.json || { echo "❌ Plugin API v2 requirement missing"; exit 1; }
          
          # Check ext-json requirement
          grep -q '"ext-json": "\*"' composer.json || { echo "❌ ext-json requirement missing"; exit 1; }
          
          echo "✅ composer.json requirements are correct"

  # Job 6: Test with different base plugins
  base-plugin-compatibility:
    name: Test with composer-patches ${{ matrix.patches-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        patches-version: ['~2.0.0', '^2.0']
        php: ['8.1']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: composer-dynamic-patches

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: none
          tools: composer:v2

      - name: Create test project
        run: |
          composer create-project drupal/recommended-project:^10 test-project --no-install
          cd test-project
          
          # Add the plugin as a path repository
          composer config repositories.composer-dynamic-patches path ../composer-dynamic-patches
          
          # Allow plugins
          composer config allow-plugins.cweagans/composer-patches true
          composer config allow-plugins.rajeshreeputra/composer-dynamic-patches true
          
          # Require specific version of base plugin
          composer require cweagans/composer-patches:${{ matrix.patches-version }} --no-update
          
          # Install the dynamic patches plugin
          composer require rajeshreeputra/composer-dynamic-patches:@dev --no-update
          
          # Install dependencies
          composer install --prefer-dist --no-progress

      - name: Verify compatibility
        run: |
          cd test-project
          composer show cweagans/composer-patches
          composer show rajeshreeputra/composer-dynamic-patches
          echo "✅ Compatible with composer-patches ${{ matrix.patches-version }}"

  # Job 7: Final summary
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [static-analysis, code-quality, composer-compatibility, integration-test, documentation, base-plugin-compatibility]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "==================================="
          echo "Test Execution Summary"
          echo "==================================="
          echo ""
          echo "Static Analysis: ${{ needs.static-analysis.result }}"
          echo "Code Quality: ${{ needs.code-quality.result }}"
          echo "Composer Compatibility: ${{ needs.composer-compatibility.result }}"
          echo "Integration Test: ${{ needs.integration-test.result }}"
          echo "Documentation: ${{ needs.documentation.result }}"
          echo "Base Plugin Compatibility: ${{ needs.base-plugin-compatibility.result }}"
          echo ""
          
          if [ "${{ needs.static-analysis.result }}" == "success" ] && \
             [ "${{ needs.code-quality.result }}" == "success" ] && \
             [ "${{ needs.composer-compatibility.result }}" == "success" ] && \
             [ "${{ needs.integration-test.result }}" == "success" ] && \
             [ "${{ needs.documentation.result }}" == "success" ] && \
             [ "${{ needs.base-plugin-compatibility.result }}" == "success" ]; then
            echo "✅ All tests passed!"
            exit 0
          else
            echo "❌ Some tests failed"
            exit 1
          fi


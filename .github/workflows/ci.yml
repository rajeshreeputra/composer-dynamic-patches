name: CI Tests

on:
  push:
    branches: [ main, develop, 2.x ]
  pull_request:
    branches: [ main, develop, 2.x ]
  workflow_dispatch:

jobs:
  # Job 1: Validate composer.json and run static analysis
  static-analysis:
    name: Static Analysis (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Check PHP syntax
        run: find src -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Display PHP version
        run: php -v

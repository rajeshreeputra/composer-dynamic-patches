name: CI Tests

on:
  push:
    branches: [ main, develop, 2.x ]
  pull_request:
    branches: [ main, develop, 2.x ]
  workflow_dispatch:

jobs:
  # Job 1: Validate composer.json and run static analysis
  static-analysis:
    name: Static Analysis (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Check PHP syntax
        run: find src -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Display PHP version
        run: php -v

  # Job 2: Integration test with real project
  integration-test:
    name: Integration Test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: composer-dynamic-patches

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: none
          tools: composer:v2

      - name: Create test project
        run: |
          composer create-project drupal/recommended-project:^10 test-project --no-install
          cd test-project
          
          # Add the plugin as a path repository
          composer config repositories.composer-dynamic-patches path ../composer-dynamic-patches
          
          # Allow plugins
          composer config allow-plugins.cweagans/composer-patches true
          composer config allow-plugins.rajeshreeputra/composer-dynamic-patches true
          
          # Install the plugin
          composer require rajeshreeputra/composer-dynamic-patches:@dev --no-update
          
          # Install all dependencies
          composer install --prefer-dist --no-progress -vv

      - name: Verify plugin loaded
        run: |
          cd test-project
          if composer show rajeshreeputra/composer-dynamic-patches > /dev/null 2>&1; then
            echo "✅ Plugin installed successfully"
          else
            echo "❌ Plugin installation failed"
            exit 1
          fi

      - name: Check vendor directory
        run: |
          cd test-project
          if [ -d "vendor" ]; then
            echo "✅ Vendor directory created"
          else
            echo "❌ Vendor directory not found"
            exit 1
          fi
